
[project]
name = "tag"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pygame-ce>=2.5.8",
    "torch>=2.2.0",
]

[project.scripts]
tag = "tag:main"
tag-train = "tag.train:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 150

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
